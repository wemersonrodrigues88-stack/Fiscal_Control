<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a2b"><title>Fiscal Control — Apurações Mobile</title><style>:root{--bg:#f5f7fb;--card:#fff;--nav:#101a2b;--text:#172033;--muted:#6d788a;--line:#e5e9ef;--blue:#1769e0;--green:#12966b;--yellow:#d88b00;--red:#d83a3a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:82px}.top{background:var(--nav);color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:5}.topline{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:18px}.sub{font-size:12px;color:#aebbd0;margin-top:3px}.user{background:#fff;color:#172033;border-radius:10px;padding:8px 10px;border:0;font-weight:700}.content{padding:14px}.notice{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}.notice b{display:block}.notice small{display:block;color:var(--muted);margin-top:3px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 9px}.sectionTitle h2{font-size:16px;margin:0}.count{font-size:12px;color:var(--muted)}.tax{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}.taxHead{padding:15px;display:flex;justify-content:space-between;align-items:center}.taxName{font-weight:900;font-size:17px}.taxMeta{font-size:11px;color:var(--muted);margin-top:3px}.taxBody{padding:0 15px 15px}.shop{border-top:1px solid var(--line);padding:13px 0}.shopTop{display:flex;justify-content:space-between;gap:10px}.shopName{font-weight:800}.tag{font-size:10px;background:#eaf1ff;color:#1d5db7;padding:5px 7px;border-radius:99px;font-weight:800}.status{font-size:11px;margin-top:3px;color:var(--muted)}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.btn{border:1px solid var(--line);border-radius:10px;padding:11px 8px;background:#fff;font-weight:800}.btn.analysis{background:#fff3d7;border-color:#efcc78;color:#956100}.btn.done{background:#e5f7f0;border-color:#bfe8d6;color:#087453}.btn:disabled{opacity:.7}.fronteiras{border-left:4px solid var(--blue)}.margin{margin-top:9px;padding:9px;background:#f7f9fc;border-radius:10px;font-size:12px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:6}.bottom button{border:0;background:none;padding:8px;font-size:11px;font-weight:750;color:var(--muted)}.bottom button.on{color:var(--blue)}.modal{position:fixed;inset:0;background:#0b142688;display:none;align-items:flex-end;z-index:10}.modal.show{display:flex}.sheet{background:#fff;width:100%;max-width:560px;margin:auto 0 0;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -15px 50px #0003}.sheet h3{margin:0 0 7px}.sheet p{color:var(--muted);font-size:13px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.choice button{padding:14px;border-radius:11px;border:1px solid var(--line);font-weight:900}.yes{background:#eaf1ff;border-color:#cbdcff!important;color:#175db8}.no{background:#fff2f2;border-color:#f0cccc!important;color:#b52d2d}.field{margin-top:14px}.field label{display:block;font-size:11px;font-weight:850;margin-bottom:5px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit}.confirm{width:100%;margin-top:14px;padding:13px;border:0;border-radius:11px;background:var(--green);color:#fff;font-weight:900}.cancel{width:100%;margin-top:8px;padding:11px;border:0;background:#f1f3f6;border-radius:11px;font-weight:800}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#142033;color:#fff;padding:11px 14px;border-radius:10px;display:none;z-index:20;font-size:12px;max-width:90%;text-align:center}.toast.show{display:block}@media(min-width:700px){body{padding:20px 0}.top{border-radius:16px 16px 0 0}}</style></head><body><div class="app"><header class="top"><div class="topline"><div><div class="brand">Fiscal Control</div><div class="sub">Apurações · Agosto/2026</div></div><button class="user">Juliane ▾</button></div></header><main class="content"><div class="notice"><b>👋 Olá, Juliane</b><small>Você visualiza somente as lojas da sua carteira.</small></div><div class="sectionTitle"><h2>Apurações de hoje</h2><span class="count" id="summary">0 finalizadas</span></div><div id="cards"></div></main><nav class="bottom"><button class="on">✓<br>Apurações</button><button>🔔<br>Alertas</button><button>☰<br>Menu</button></nav></div><div class="modal" id="modal"><div class="sheet"><h3>Foi feita a análise diária?</h3><p id="modalText">ICMS · Loja Vitória — PE</p><div class="choice"><button class="no" onclick="finishNo()">NÃO</button><button class="yes" onclick="showDate()">SIM</button></div><div id="dateArea"></div><button class="cancel" onclick="closeModal()">Cancelar</button></div></div><div class="toast" id="toast"></div><script>const stores=[{id:'02',name:'Vitória',state:'PE'},{id:'03',name:'Arcoverde',state:'PE'},{id:'04',name:'Santa Cruz',state:'PE'},{id:'05',name:'Bongi',state:'PE'}],taxes=['ICMS','PIS/COFINS','ISS','SPED ICMS','Fronteiras'];let selected=null;const state={};function key(t,s){return t+'-'+s.id}function render(){document.getElementById('cards').innerHTML=taxes.map(t=>{let list=stores;if(t==='Fronteiras')list=stores.filter(s=>s.state==='PE');let done=list.filter(s=>state[key(t,s)]?.status==='done').length;return `<article class="tax ${t==='Fronteiras'?'fronteiras':''}"><div class="taxHead"><div><div class="taxName">${t}</div><div class="taxMeta">${list.length} lojas da sua carteira · ${done} finalizadas</div></div><span class="tag">${t==='ICMS'?'Rotina diária':t==='Fronteiras'?'PE · margem':'Obrigação'}</span></div><div class="taxBody">${list.map(s=>shop(t,s)).join('')}</div></article>`}).join('');let all=Object.values(state).filter(x=>x.status==='done').length;document.getElementById('summary').textContent=all+' finalizadas'}function shop(t,s){let x=state[key(t,s)]||{status:'pending'},st=x.status;return `<div class="shop"><div class="shopTop"><div><div class="shopName">${s.name}</div><div class="status">${s.state} · ${st==='done'?'Finalizada':st==='analysis'?'Analisando':'Pendente'}</div></div>${st==='done'?'<span class="tag">✓ Finalizada</span>':''}</div>${t==='Fronteiras'&&s.state==='PE'?`<div class="margin">Margem: <b>${x.margin||'não definida'}</b></div>`:''}<div class="buttons"><button class="btn ${st==='analysis'?'analysis':''}" onclick="setAnalysis('${t}','${s.id}')">${st==='analysis'?'🟡 Analisando':'Analisar'}</button><button class="btn ${st==='done'?'done':''}" onclick="openFinish('${t}','${s.id}')">${st==='done'?'✓ Finalizada':'Finalizar'}</button></div></div>`}function setAnalysis(t,id){state[key(t,stores.find(s=>s.id===id))]={...(state[key(t,stores.find(s=>s.id===id))]||{}),status:'analysis',started:new Date().toISOString()};render();toast('Apuração marcada como analisando.')}function openFinish(t,id){selected={t,id};document.getElementById('modalText').textContent=t+' · Loja '+stores.find(s=>s.id===id).name+' — '+stores.find(s=>s.id===id).state;document.getElementById('dateArea').innerHTML='';document.getElementById('modal').classList.add('show')}function finishNo(){let s=stores.find(x=>x.id===selected.id);state[key(selected.t,s)]={status:'done',daily:false,finished:new Date().toISOString()};closeModal();render();notify(selected.t,s,false);toast('Finalizada. Alerta enviado à coordenação e gerência.')}function showDate(){document.getElementById('dateArea').innerHTML='<div class="field"><label>Data do último dia analisado</label><input id="lastDate" type="date" max="'+new Date().toISOString().slice(0,10)+'"></div><button class="confirm" onclick="finishYes()">Confirmar e finalizar</button>'}function finishYes(){let d=document.getElementById('lastDate').value;if(!d)return toast('Informe a data do último dia analisado.');let s=stores.find(x=>x.id===selected.id);state[key(selected.t,s)]={status:'done',daily:true,lastDate:d,finished:new Date().toISOString()};closeModal();render();notify(selected.t,s,true,d);toast('Finalizada. Coordenação e gerência notificadas.')}function notify(t,s,d,date){console.log({destinatarios:['Leonardo — Coordenador','Daniela — Gerente'],imposto:t,loja:s.name,estado:s.state,analiseDiaria:d,ultimoDiaAnalisado:date||null})}function closeModal(){document.getElementById('modal').classList.remove('show');selected=null}function toast(x){let e=document.getElementById('toast');e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)}render();</script></body></html>
