name: Ativar matriz de acesso e autenticação

on:
  push:
    branches: [main]
    paths:
      - 'acesso-perfis.js'
      - 'auth-client.js'
      - 'auth-client.css'
      - 'auth-config.js'
      - 'auth-ui-hardening.js'
      - 'gestor-acompanhamento.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conectar autenticação real sem alterar o layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          head_tags = [
              '<link rel="stylesheet" href="auth-client.css?v=2">',
          ]
          body_tags = [
              '<script src="acesso-perfis.js?v=2"></script>',
              '<script src="auth-config.js?v=2"></script>',
              '<script src="auth-client.js?v=2"></script>',
              '<script src="auth-ui-hardening.js?v=1"></script>',
              '<script src="gestor-acompanhamento.js?v=1"></script>',
          ]
          for tag in head_tags:
              if tag not in s:
                  marker = '</head>'
                  if marker not in s: raise SystemExit('head não encontrado')
                  s = s.replace(marker, tag + marker, 1)
          for tag in body_tags:
              src = tag.split('src="', 1)[1].split('"', 1)[0]
              if src.split('?')[0] not in s:
                  marker = '</body>'
                  if marker not in s: raise SystemExit('body não encontrado')
                  s = s.replace(marker, tag + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Publicar ativação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Inclui acompanhamento do gestor"
          git push
