name: Fix operacional do analista

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'fix: operacional do analista') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar painel do analista
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('dashboard-analista-v2.js')
          s = p.read_text(encoding='utf-8')
          marker = '/* ANALISTA-OPERACIONAL-FIX-V1 */'
          if marker in s:
              raise SystemExit(0)

          old_store = re.search(r'  function storeAccess\(\)\{.*?\n  \}\n  function messages', s, re.S)
          if not old_store:
              raise SystemExit('storeAccess nao encontrada')

          new_store = r'''  function storeAccess(){let card=document.getElementById('fc-analyst-stores-card');const anchor=document.querySelector('#page-dashboard .grid.two');if(!anchor)return;if(!card){card=document.createElement('div');card.id='fc-analyst-stores-card';card.className='card pad fc-analyst-store-card';anchor.appendChild(card)}const ss=stores();card.innerHTML='<div class="cardTitle"><h3>Minha carteira</h3><span class="badge blue">'+ss.length+'</span></div><div style="font-size:11px;color:#687589;margin-bottom:8px">Lojas vinculadas à sua carteira.</div>'+ (ss.map(l=>`<div class="fc-analyst-store"><div><b>${esc(l.numero)} · ${esc(l.nome)}</b><small>${esc(l.uf||'—')} · ${esc(l.analista||'')}</small></div><button class="btn" type="button" data-own-store="${Number(l.id)}">Completar cadastro</button></div>`).join('')||'<div class="fc-empty-msg">Nenhuma loja ativa vinculada à sua carteira.</div>');card.querySelectorAll('[data-own-store]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.ownStore);const own=stores().some(l=>Number(l.id)===id);if(!own)return;if(typeof window.openStore==='function')window.openStore(id);else if(typeof window.go==='function')window.go('carteiras')})}
  function messages'''
          s = s[:old_store.start()] + new_store + s[old_store.end():]

          deadline = r'''  function restrictDeadlines(){if(!isAnalyst())return;const page=document.getElementById('page-prazos');if(!page)return;const ss=stores();const ufs=[...new Set(ss.map(l=>String(l.uf||'').trim().toUpperCase()).filter(Boolean))];const allowed=new Set(ufs);const head=page.querySelector('.head');if(head){const p=head.querySelector('p');if(p)p.textContent=ufs.length?'Visualização dos prazos do estado da sua carteira. Os vencimentos são somente para consulta.':'Nenhum estado vinculado à sua carteira.';const add=head.querySelector('.btn.primary');if(add)add.style.display='none'}const cards=document.getElementById('deadlineCards');if(cards){cards.querySelectorAll('.card').forEach(card=>{const uf=(card.querySelector('.cardTitle h3')?.textContent||'').trim().toUpperCase();card.style.display=allowed.has(uf)?'':'none';if(allowed.has(uf))card.querySelectorAll('.metric .btn').forEach(btn=>{const span=document.createElement('span');span.className=btn.className;span.textContent=btn.textContent;span.style.cursor='default';span.style.pointerEvents='none';btn.replaceWith(span)})})}const table=document.getElementById('deadlineTable');if(table){table.querySelectorAll('tr').forEach(tr=>{const cells=tr.querySelectorAll('td');if(cells.length>=2)tr.style.display=allowed.has((cells[1].textContent||'').trim().toUpperCase())?'':'none'})}}
  function hookDeadlineRender(){if(window.__fcAnalystDeadlineHook)return;if(typeof window.renderPrazos!=='function')return;const original=window.renderPrazos;window.renderPrazos=function(){const r=original.apply(this,arguments);setTimeout(restrictDeadlines,0);return r};window.__fcAnalystDeadlineHook=true;restrictDeadlines()}
'''
          s = s.replace('  function protectStoreEdit', deadline + '  function protectStoreEdit', 1)
          s = s.replace('taxPicker();storeAccess();chart();messages();protectStoreEdit()', 'taxPicker();storeAccess();chart();messages();hookDeadlineRender();restrictDeadlines();protectStoreEdit()', 1)
          s = s.rstrip() + '\n' + marker + '\n'
          p.write_text(s, encoding='utf-8')

      - name: Publicar ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-analista-v2.js .github/workflows/fix-analista-operacional.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: operacional do analista"
          git push
