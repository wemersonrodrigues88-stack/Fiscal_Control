name: Ativar correção de carteira em tempo real

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir correção de carteira
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="carteiras-assignment-live-fix.js?v=2"></script>'
          marker = '</body>'
          if marker not in s:
              raise SystemExit('Marcador </body> não encontrado')
          if tag not in s:
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: ativar carteira em tempo real"
          git push