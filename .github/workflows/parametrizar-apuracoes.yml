name: Parametrizar botoes de Apuracoes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  parametrizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conectar parametrizacao ao HTML
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker_v1 = '<!-- APURACOES-PARAMETRIZACAO-V1 -->'
          marker_v2 = '<!-- APURACOES-FLUXO-V2 -->'
          if marker_v2 not in s:
              tag = '<script src="apuracoes-fluxo-v2.js?v=2"></script>' + marker_v2
              pos = s.rfind('</body>')
              if pos < 0:
                  raise SystemExit('Tag </body> nao encontrada')
              s = s[:pos] + tag + s[pos:]
          if marker_v1 not in s:
              tag = '<script src="apuracoes-parametrizacao.js?v=1"></script>' + marker_v1
              pos = s.rfind('</body>')
              if pos < 0:
                  raise SystemExit('Tag </body> nao encontrada')
              s = s[:pos] + tag + s[pos:]
          p.write_text(s, encoding='utf-8')
      - name: Publicar parametrizacao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Carrega fluxo V2 das apuracoes"
          git push
