name: Parametrizar botoes de Apuracoes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  parametrizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conectar parametrizacao ao HTML
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker_v1 = '<!-- APURACOES-PARAMETRIZACAO-V1 -->'
          marker_v2 = '<!-- APURACOES-FLUXO-V2 -->'
          tag_v1 = '<script src="apuracoes-parametrizacao.js?v=1"></script>' + marker_v1
          tag_v2 = '<script src="apuracoes-fluxo-v2.js?v=2"></script>' + marker_v2

          # Mantem a parametrizacao V1 se ainda nao existir.
          if marker_v1 not in s:
              pos = s.rfind('</body>')
              if pos < 0:
                  raise SystemExit('Tag </body> nao encontrada')
              s = s[:pos] + tag_v1 + s[pos:]

          # O V2 precisa ser o ULTIMO script do HTML. Scripts antigos de apuracoes
          # estavam depois dele e sobrescreviam renderApuracoes/setStatus.
          pattern = r'<script[^>]*src=["\']apuracoes-fluxo-v2\.js\?v=2["\'][^>]*></script>\s*<!-- APURACOES-FLUXO-V2 -->'
          s = re.sub(pattern, '', s, count=1)
          pos = s.rfind('</body>')
          if pos < 0:
              raise SystemExit('Tag </body> nao encontrada')
          s = s[:pos] + tag_v2 + s[pos:]

          p.write_text(s, encoding='utf-8')
      - name: Publicar parametrizacao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Prioriza fluxo V2 das apuracoes"
          git push
