name: Parametrizar botoes de Apuracoes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  parametrizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conectar parametrizacao ao HTML
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- APURACOES-PARAMETRIZACAO-V1 -->'
          if marker in s:
              raise SystemExit(0)
          tag = '<script src="apuracoes-parametrizacao.js?v=1"></script>' + marker
          pos = s.rfind('</body>')
          if pos < 0:
              raise SystemExit('Tag </body> nao encontrada')
          s = s[:pos] + tag + s[pos:]
          p.write_text(s, encoding='utf-8')
      - name: Publicar parametrizacao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Parametriza botoes de status das apuracoes"
          git push
