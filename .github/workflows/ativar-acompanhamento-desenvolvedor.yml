name: Ativar acompanhamento do desenvolvedor

on:
  push:
    branches: [main]
    paths:
      - 'desenvolvedor-acompanhamento.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir acesso técnico aos acompanhamentos
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="desenvolvedor-acompanhamento.js?v=1"></script>'
          marker = '</body>'
          if marker not in s:
              raise SystemExit('Marcador </body> não encontrado')
          if tag not in s:
              s = s.replace(marker, tag + marker, 1)
              p.write_text(s, encoding='utf-8')
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: acesso do desenvolvedor aos acompanhamentos"
          git push
