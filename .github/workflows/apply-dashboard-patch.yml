name: Aplicar correções do dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ativar scripts de correção
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</body>'
          if marker not in s:
              raise SystemExit('Marcador </body> não encontrado')
          tags = [
              '<script src="dashboard-patch.js"></script>',
              '<script src="equipe-data-fix.js"></script>',
              '<script src="dashboard-patch-teamfix.js"></script>',
              '<script src="carteiras-data-fix.js"></script>',
              '<script src="operational-pages-fix.js"></script>',
              '<script src="carteiras-row-hover.js"></script>',
              '<script src="dashboard-analista-v2.js?v=2"></script>',
              '<script src="analista-hotfix-v4.js?v=1"></script>'
          ]
          for tag in tags:
              src = tag.split(' src="',1)[1].split('"',1)[0]
              base = src.split('?')[0]
              import re
              s = re.sub(r'<script src="'+re.escape(base)+r'(?:\?[^\"]*)?"[^>]*></script>', '', s)
              s = s.replace(marker, tag + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Publicar correções
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Ativa hotfix operacional do analista"
          git push
