name: Aplicar patch do dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir patches do dashboard
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</body>'
          if marker not in s:
              raise SystemExit('Marcador </body> não encontrado')
          tags = [
              '<script src="dashboard-patch.js"></script>',
              '<script src="dashboard-patch-teamfix.js"></script>'
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace(marker, tag + marker, 1)
          p.write_text(s, encoding='utf-8')
      - name: Publicar patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Ativa correção da lista completa da Equipe"
          git push