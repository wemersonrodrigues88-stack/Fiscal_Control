name: Ativar painel operacional do analista

on:
  workflow_run:
    workflows: ["Aplicar correções do dashboard"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Ativar script do analista
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="dashboard-analista-v2.js?v=1"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('Marcador </body> não encontrado')
              s=s.replace(marker,tag+marker,1)
              p.write_text(s,encoding='utf-8')
      - name: Publicar ativação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Ativa painel operacional do analista"
          git push origin main
