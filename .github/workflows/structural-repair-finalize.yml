name: Structural repair finalize

on:
  push:
    branches: [main]
    paths:
      - 'STRUCTURAL_FINALIZE_TRIGGER.txt'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden profile migration
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/fiscal-control-auth-worker.js')
          s=p.read_text(encoding='utf-8')
          old="INSERT INTO users(username,display_name,profile,privilege,status,password_hash,password_salt,password_iterations,must_change_password,created_at,updated_at) SELECT username,display_name,profile,privilege,status,password_hash,password_salt,password_iterations,must_change_password,created_at,updated_at FROM users_legacy;"
          new="INSERT OR REPLACE INTO users(username,display_name,profile,privilege,status,password_hash,password_salt,password_iterations,must_change_password,created_at,updated_at) SELECT username,display_name,profile,privilege,status,password_hash,password_salt,password_iterations,must_change_password,created_at,updated_at FROM users_legacy;"
          if old not in s:
              raise SystemExit('migration copy statement not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          Path('STRUCTURAL_FINALIZE_TRIGGER.txt').unlink(missing_ok=True)
          Path('.github/workflows/structural-repair-finalize.yml').unlink(missing_ok=True)
      - name: Commit final structural hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden auth profile migration"
          git push origin main
