name: Suspender Apuracoes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar fluxo Pendente e Suspender Apuracao
        shell: python
        run: |
          from pathlib import Path

          # 1) A camada de parametrizacao ganha a acao de suspensao.
          p = Path('apuracoes-parametrizacao.js')
          s = p.read_text(encoding='utf-8')
          marker_js = '/* APURACOES-SUSPENSAO-V1 */'
          if marker_js not in s:
              anchor = "  window.finalizar=function(lojaId,tax){window.setStatus(lojaId,tax,PARAMETROS.statusFinalizado)};"
              if anchor not in s:
                  raise SystemExit('Ponto de insercao de suspensao nao encontrado')
              insert = """\n\n  // Suspensao: volta imediatamente para Pendente e zera toda a apuracao.\n  window.suspenderApuracao=function(lojaId,tax){\n    const loja=findStore(lojaId);\n    if(!loja||!allowedStore(loja))return notify('Acesso não permitido para esta loja.');\n    const data=execs(),key=executionKey(loja.id,tax),previous=data[key]||{};\n    if(!previous.status||previous.status==='Pendente')return;\n    data[key]={\n      lojaId:loja.id,lojaNumero:loja.numero,lojaNome:loja.nome,\n      analista:loja.analista||'',imposto:tax,status:'Pendente',\n      queryElapsedMs:0,analysisElapsedMs:0,queryStartedAt:null,analysisStartedAt:null,\n      iniciadoEm:null,finalizadoEm:null,tempoTotalMs:0,tempoMs:0,\n      atualizadoEm:new Date().toISOString(),atualizadoPor:currentUser(),\n      suspensaEm:new Date().toISOString(),suspensaPor:currentUser()\n    };\n    saveExecs(data);\n    safeRefresh();\n    notify(loja.nome+' · '+tax+' → Pendente');\n  };\n  /* APURACOES-SUSPENSAO-V1 */"""
              s=s.replace(anchor,anchor+insert,1)
              p.write_text(s,encoding='utf-8')

          # 2) A tela de Apuracoes passa a exibir a acao em qualquer etapa ativa.
          h = Path('index.html')
          html = h.read_text(encoding='utf-8')
          marker_html='<!-- APURACOES-SUSPENSAO-UI-V1 -->'
          if marker_html not in html:
              old = '<button class="btn green" onclick="finalizar(${l.id},\'${ob}\')">Finalizar</button></div>'
              new = '<button class="btn green" onclick="finalizar(${l.id},\'${ob}\')">Finalizar</button>${status!==\'Pendente\'?`<button class="btn red" onclick="suspenderApuracao(${l.id},\'${ob}\')">Suspender Apuração</button>`:\'\'}</div>'
              if old not in html:
                  raise SystemExit('Botao Finalizar nao encontrado no index.html')
              html=html.replace(old,new,1)
              html=html.replace('</body>',''+marker_html+'</body>',1)
              h.write_text(html,encoding='utf-8')

      - name: Publicar alteracao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apuracoes-parametrizacao.js
          git diff --cached --quiet && exit 0
          git commit -m "Adiciona suspensao e retorno para pendente nas apuracoes"
          git push
