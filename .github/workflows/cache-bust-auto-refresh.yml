name: Cache bust auto refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bust:
    if: ${{ !contains(github.event.head_commit.message, 'chore: atualizar cache do auto refresh') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar versao do script
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="equipe-data-fix.js"></script>'
          new='<script src="equipe-data-fix.js?v=6d7bf9f"></script>'
          if new not in s and tag in s:
              s=s.replace(tag,new,1)
              p.write_text(s,encoding='utf-8')
          else:
              raise SystemExit(0)
      - name: Commit cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: atualizar cache do auto refresh"
          git push
