name: Carregar fluxo definitivo das apuracoes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  carregar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conectar fluxo V2 ao HTML
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- APURACOES-FLUXO-V2 -->'
          if marker in s:
              raise SystemExit(0)
          tag = '<script src="apuracoes-fluxo-v2.js?v=2"></script>' + marker
          pos = s.rfind('</body>')
          if pos < 0:
              raise SystemExit('Tag </body> nao encontrada')
          s = s[:pos] + tag + s[pos:]
          p.write_text(s, encoding='utf-8')
      - name: Publicar fluxo V2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Conecta fluxo definitivo das apuracoes"
          git push
