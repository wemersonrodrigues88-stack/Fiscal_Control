name: Ativar dashboard analista V5

on:
  push:
    branches: [main]
    paths:
      - 'analista-dashboard-v5.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Ativar V5 no index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="analista-dashboard-v5.js?v=1"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('Marcador </body> não encontrado')
              s=s.replace(marker,tag+marker,1)
              p.write_text(s,encoding='utf-8')
      - name: Publicar V5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Substitui obrigações por estado por progresso por imposto"
          git push origin main
