name: Ocultar apuracoes para gestores

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ocultacao por perfil
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('auth-client.js')
          text = p.read_text(encoding='utf-8')
          marker = '/* gestor-apuracoes-hidden-v1 */'
          if marker in text:
              print('Patch ja aplicado.')
              raise SystemExit(0)
          target = '/* auth-ui activation trigger v3 */'
          patch = r'''

/* gestor-apuracoes-hidden-v1 */
(() => {
  function hideApuracoesForGestores() {
    const user = window.FC_AUTH?.user;
    if (!user) return;
    const isDeveloper = user.privilegio === 'Desenvolvedor';
    const isGestor = user.perfil === 'Gerente' || user.perfil === 'Coordenador';
    if (!isGestor || isDeveloper) return;

    document.querySelectorAll('[data-page="apuracoes"]').forEach(el => {
      el.style.display = 'none';
    });

    document.querySelectorAll('button').forEach(btn => {
      const text = (btn.textContent || '').trim().toLowerCase();
      if (text === 'abrir apurações' || text === 'ver todas as execuções') {
        btn.style.display = 'none';
      }
    });

    const page = document.getElementById('page-apuracoes');
    if (page && page.classList.contains('active')) {
      const dashboard = document.getElementById('page-dashboard');
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      if (dashboard) dashboard.classList.add('active');
    }
  }

  const apply = () => {
    try { hideApuracoesForGestores(); } catch (_) {}
  };

  document.addEventListener('DOMContentLoaded', apply);
  setInterval(apply, 500);
})();
'''
          if target not in text:
              raise SystemExit('Marcador de injecao nao encontrado.')
          p.write_text(text.replace(target, patch + '\n' + target, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auth-client.js
          git commit -m 'Oculta apuracoes para gerente e coordenador'
          git push
