name: Ativar destaque de linhas da Equipe

on:
  push:
    branches: [main]
    paths:
      - 'equipe-row-hover.js'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ativar script sem alterar estrutura
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="equipe-row-hover.js?v=1"></script>'
          marker='</body>'
          if marker not in s:
              raise SystemExit('Marcador </body> não encontrado')
          if 'equipe-row-hover.js' not in s:
              s=s.replace(marker,tag+marker,1)
              p.write_text(s,encoding='utf-8')
      - name: Publicar ativação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Ativa destaque ao passar o mouse na Equipe"
          git push
