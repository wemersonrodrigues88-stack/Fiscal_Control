name: Structural repair once

on:
  push:
    branches: [main]
    paths:
      - 'STRUCTURAL_REPAIR_TRIGGER.txt'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply consolidated architecture fixes
        shell: python
        run: |
          from pathlib import Path

          def read(p):
              return Path(p).read_text(encoding='utf-8')
          def write(p, s):
              Path(p).write_text(s, encoding='utf-8')

          # 1) Central persistence response compatibility: Worker uses state_key/state_value.
          p='persistencia-central.js'
          s=read(p)
          s=s.replace("const remoteKeys=new Set(states.map(x=>x.key));", "const remoteKeys=new Set(states.map(x=>x.key||x.state_key));")
          s=s.replace("if(!key(x.key)||dirty.has(x.key))continue;\n        if(x.value===null||x.value==='null')R.call(localStorage,x.key);else S.call(localStorage,x.key,String(x.value));", "const stateKey=x.key||x.state_key; const stateValue=x.value??x.state_value;\n        if(!key(stateKey)||dirty.has(stateKey))continue;\n        if(stateValue===null||stateValue==='null')R.call(localStorage,stateKey);else S.call(localStorage,stateKey,String(stateValue));")
          write(p,s)

          # 2) Remove the second management implementation. Keep only the consolidated module.
          compatibility="""/* Fiscal Control — compatibilidade.\n   Acompanhamento de gestão é implementado exclusivamente por\n   acompanhamento-gestao-consolidado.js. Este arquivo permanece apenas\n   porque versões antigas do HTML ainda podem referenciá-lo.\n*/\n(function(){\n  'use strict';\n  function load(){\n    if(document.querySelector('script[data-fc-acomp-consolidado]'))return;\n    const s=document.createElement('script');\n    s.src='/acompanhamento-gestao-consolidado.js?v=3';\n    s.async=false;\n    s.dataset.fcAcompConsolidado='1';\n    document.body.appendChild(s);\n  }\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load);else load();\n})();\n"""
          write('gestor-acompanhamento.js', compatibility)
          write('acompanhamento-individual-ativos.js', compatibility)

          # 3) Remove all identity-by-name fallbacks from the consolidated management layer.
          p='acompanhamento-gestao-consolidado.js'
          s=read(p)
          s=s.replace("  const currentName=()=>String(document.getElementById('usuario')?.value||'').trim();\n", "")
          old="""  function management(){\n    const u=authUser();\n    if(u?.privilegio==='Desenvolvedor')return true;\n    if(u?.perfil==='Gerente'||u?.perfil==='Coordenador'||u?.profile==='Gerente'||u?.profile==='Coordenador')return true;\n    return ['Daniela','Leonardo'].includes(currentName());\n  }"""
          new="""  function management(){\n    const u=authUser();\n    return !!u && (u.privilegio==='Desenvolvedor'||u.perfil==='Gerente'||u.perfil==='Coordenador'||u.perfil==='Gestão'||u.profile==='Gerente'||u.profile==='Coordenador'||u.profile==='Gestão');\n  }"""
          if old not in s:
              raise SystemExit('management block not found in consolidated module')
          s=s.replace(old,new)
          s=s.replace("    const actions=document.getElementById('fcg-actions');\n    if(actions)actions.style.display=management()?'flex':'none';", "    const actions=document.getElementById('fcg-actions');\n    if(actions)actions.style.display=management()?'flex':'none';\n    const accessButton=document.getElementById('fc-management-access-btn');\n    if(accessButton){ accessButton.onclick=()=>{ if(management()) openGeneral(); }; }")
          s=s.replace("  window.FiscalControlAcompanhamento={openGeneral,openIndividual,close,activeAnalysts,activeStores};", "  window.FiscalControlAcompanhamento={openGeneral,openIndividual,close,activeAnalysts,activeStores,canManage:management};")
          write(p,s)

          # 4) Authentication config is descriptive only; never contains a user-name role matrix.
          write('auth-config.js', """/* Fiscal Control — integração da autenticação.\n   A identidade e as permissões reais vêm exclusivamente do Worker/D1.\n*/\nwindow.FC_AUTH_CONFIG={\n  version:2,\n  mode:'backend-required',\n  loginPath:'/api/login',\n  sessionKey:'fc_session',\n  profiles:['Analista','Coordenador','Gerente','Gestão'],\n  privileges:['Desenvolvedor']\n};\n""")

          # 5) Make the developer shortcut invoke the real consolidated view instead of merely scrolling.
          p='auth-client.js'
          s=read(p)
          old="""      button.onclick = () => {\n        const actions = document.getElementById('fcg-actions');\n        if (actions) {\n          actions.scrollIntoView({ behavior:'smooth', block:'center' });\n          const general = actions.querySelector('#fcg-general-btn');\n          if (general) general.focus();\n          return;\n        }\n        if (window.FiscalControlAcompanhamento?.openGeneral) window.FiscalControlAcompanhamento.openGeneral();\n      };"""
          new="""      button.onclick = () => {\n        const api = window.FiscalControlAcompanhamento;\n        if (api?.openGeneral) { api.openGeneral(); return; }\n        const actions = document.getElementById('fcg-actions');\n        if (actions) actions.scrollIntoView({ behavior:'smooth', block:'center' });\n      };"""
          if old not in s:
              raise SystemExit('developer management button block not found')
          s=s.replace(old,new)
          write(p,s)

          # 6) Worker always injects the central persistence layer and the single consolidated management layer.
          p='src/fiscal-control-worker-main.js'
          s=read(p)
          old="""async function asset(r,e){const x=await authWorker.fetch(r,e);const ct=x.headers.get('content-type')||'';if(!ct.includes('text/html'))return x;let t=await x.text();if(!t.includes('persistencia-central.js'))t=t.replace(/<\\/head>/i,'<script src=\"/persistencia-central.js?v=3\" defer></script></head>');return new Response(t,{status:x.status,statusText:x.statusText,headers:x.headers})}"""
          new="""async function asset(r,e){const x=await authWorker.fetch(r,e);const ct=x.headers.get('content-type')||'';if(!ct.includes('text/html'))return x;let t=await x.text();if(!t.includes('persistencia-central.js'))t=t.replace(/<\\/head>/i,'<script src=\"/persistencia-central.js?v=4\" defer></script></head>');if(!t.includes('acompanhamento-gestao-consolidado.js'))t=t.replace(/<\\/body>/i,'<script src=\"/acompanhamento-gestao-consolidado.js?v=3\"></script></body>');return new Response(t,{status:x.status,statusText:x.statusText,headers:x.headers})}"""
          if old not in s:
              raise SystemExit('worker asset block not found')
          s=s.replace(old,new)
          write(p,s)

          # 7) Backend recognizes Gestão as a real profile and keeps Desenvolvedor independent of profile.
          p='src/fiscal-control-auth-worker.js'
          s=read(p)
          s=s.replace("const RULES = { Analista: ['dashboard','apuracoes'], Coordenador: ALL_PAGES, Gerente: ALL_PAGES };", "const RULES = { Analista: ['dashboard','apuracoes'], Coordenador: ALL_PAGES, Gerente: ALL_PAGES, Gestão: ALL_PAGES };")
          s=s.replace("profile TEXT NOT NULL CHECK(profile IN ('Analista','Coordenador','Gerente'))", "profile TEXT NOT NULL CHECK(profile IN ('Analista','Coordenador','Gerente','Gestão'))")
          s=s.replace("u.perfil==='Coordenador')", "u.perfil==='Coordenador'||u.perfil==='Gestão')")
          # Existing D1 databases may have the old CHECK constraint. Rebuild users/sessions once and force re-login.
          marker="async function schema(env){if(!env.DB)throw new Error('AUTH_DB_NOT_BOUND');if(!schemaReady)schemaReady=env.DB.exec(SCHEMA).catch(e=>{schemaReady=null;throw e});await schemaReady}"
          replacement="""let migrationReady;\nasync function migrateProfileSchema(env){\n  const row=await env.DB.prepare(\"SELECT sql FROM sqlite_master WHERE type='table' AND name='users'\").first();\n  if(!row?.sql || row.sql.includes(\"'Gestão'\"))return;\n  await env.DB.exec(`PRAGMA foreign_keys=OFF; ALTER TABLE sessions RENAME TO sessions_legacy; ALTER TABLE users RENAME TO users_legacy; ${SCHEMA} INSERT INTO users(username,display_name,profile,privilege,status,password_hash,password_salt,password_iterations,must_change_password,created_at,updated_at) SELECT username,display_name,profile,privilege,status,password_hash,password_salt,password_iterations,must_change_password,created_at,updated_at FROM users_legacy; DROP TABLE sessions_legacy; DROP TABLE users_legacy; PRAGMA foreign_keys=ON;`);\n}\nasync function schema(env){if(!env.DB)throw new Error('AUTH_DB_NOT_BOUND');if(!schemaReady)schemaReady=env.DB.exec(SCHEMA).catch(e=>{schemaReady=null;throw e});await schemaReady;if(!migrationReady)migrationReady=migrateProfileSchema(env).catch(e=>{migrationReady=null;throw e});await migrationReady}"""
          if marker not in s:
              raise SystemExit('schema marker not found in auth worker')
          s=s.replace(marker,replacement)
          write(p,s)

          # 8) Remove the one-time trigger and this workflow after successful repair.
          Path('STRUCTURAL_REPAIR_TRIGGER.txt').unlink(missing_ok=True)
          Path('.github/workflows/structural-repair-once.yml').unlink(missing_ok=True)

      - name: Commit structural repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolidate auth management and central sync"
          git push origin main
