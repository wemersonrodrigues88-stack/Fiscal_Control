name: Fix auth password CPU

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adjust PBKDF2 cost for Workers runtime
        run: |
          file="src/fiscal-control-auth-worker.js"
          if grep -q "const PASSWORD_ITERATIONS = 310000;" "$file"; then
            sed -i "s/const PASSWORD_ITERATIONS = 310000;/const PASSWORD_ITERATIONS = 100000;/" "$file"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$file"
            git commit -m "Corrige custo de hash da senha no Worker"
            git push
          else
            echo "Ajuste já aplicado; nenhuma alteração necessária."
          fi
