name: Rebuild clean Fiscal Control runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace entrypoint
        run: |
          cat > index.html <<'EOF'
          <!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a2b"><title>Fiscal Control — Gestão Fiscal Mensal</title><link rel="stylesheet" href="app-clean.css?v=1"></head><body>
          <div id="auth" class="auth"><div class="authCard"><div class="authBrand"><div class="authMark">FC</div><div><b>Fiscal Control</b><small style="display:block;color:#687589">Gestão Fiscal Mensal</small></div></div><h2 style="margin:0 0 4px">Acesso ao sistema</h2><div style="font-size:11px;color:#687589">Entre com seu usuário e senha.</div><form id="loginForm"><label>Usuário<input id="username" autocomplete="username" required></label><label>Senha<input id="password" type="password" autocomplete="current-password" required></label><div id="loginError" class="error"></div><button class="btn primary" type="submit">Entrar</button></form></div></div>
          <div id="app" class="app" style="display:none"><aside class="side"><div class="logo"><div class="logoMark">FC</div><div class="logoText"><b>Fiscal Control</b><small>Gestão Fiscal Mensal</small></div></div><nav class="nav"><button class="on" data-page="dashboard"><i>▦</i><span>Visão geral</span></button><button data-page="apuracoes"><i>✓</i><span>Apurações</span></button><button data-page="carteiras"><i>⌂</i><span>Carteiras</span></button><button data-page="prazos"><i>◷</i><span>Prazos</span></button><button data-page="historico"><i>↗</i><span>Histórico</span></button><button data-page="equipe"><i>♙</i><span>Equipe</span></button><button id="navGestao" data-page="gestao" style="display:none"><i>◉</i><span>Gestão</span></button></nav><div class="sideFoot">Projeto 2 · independente do Radar</div></aside><main class="main"><header class="top"><div><div class="topTitle" id="topTitle">Visão geral do setor</div><div class="topSub">Competência <b id="competencia"></b></div></div><div class="persona"><div class="avatar" id="avatar">FC</div><button class="btn" onclick="CLEAN_LOGOUT()">Sair</button></div></header><div class="wrap">
          <section class="page active" id="page-dashboard"><div class="head"><div><h1>Controle Fiscal</h1><p>Acompanhamento mensal de execução e prazos.</p></div><div class="actions"><button class="btn" onclick="go('prazos')">⚙ Prazos</button><button class="btn primary" onclick="go('apuracoes')">Abrir apurações</button></div></div><div class="grid kpis" id="kpis"></div><div class="grid two"><div class="card pad"><div class="cardTitle"><h3>Obrigações por estado</h3><span class="badge blue" id="mesBadge"></span></div><div id="obrigacoes"></div></div><div class="card pad"><div class="cardTitle"><h3>Alertas para decisão</h3><span class="badge redbg" id="alertBadge">0</span></div><div id="alertas"></div></div></div><div class="grid two" style="margin-top:14px"><div class="card pad"><div class="cardTitle"><h3>Analistas</h3><button class="btn" onclick="go('equipe')">Equipe</button></div><div class="tableWrap"><table class="table"><thead><tr><th>Analista</th><th>Lojas</th><th>Conclusão</th><th>Alertas</th><th>Status</th></tr></thead><tbody id="teamDash"></tbody></table></div></div><div class="card pad"><div class="cardTitle"><h3>Quem pode ajudar?</h3></div><div id="ajuda"></div></div></div><div class="grid dashLower"><div class="card pad"><div class="cardTitle"><h3>Resumo das execuções</h3><span class="badge blue">5 obrigações</span></div><div class="execRow execHead"><span>Obrigação</span><span>Pendente</span><span>Analisando</span><span>Finalizado</span><span>Conclusão</span></div><div id="execResumo"></div></div><div class="card pad"><div class="cardTitle"><h3>Próximos prazos</h3><span class="badge blue">Calendário</span></div><div id="proximosPrazos"></div></div></div></section>
          <section class="page" id="page-apuracoes"><div class="head"><div><h1>Apurações por imposto</h1><p>A visão operacional respeita a carteira do usuário.</p></div></div><div class="filters"><input id="busca" placeholder="🔎 Buscar loja" oninput="renderApuracoes()"><select id="filtroImposto" onchange="renderApuracoes()"></select><select id="filtroUF" onchange="renderApuracoes()"><option value="">Todos os estados</option><option>PE</option><option>AL</option><option>PB</option><option>SP</option></select></div><div class="grid three" id="taxCards"></div></section>
          <section class="page" id="page-carteiras"><div class="head"><div><h1>Carteiras</h1><p>Base de unidades e responsáveis.</p></div><button class="btn primary" onclick="openStore()">+ Nova loja</button></div><div class="filters"><input id="storeSearch" placeholder="🔎 Buscar loja" oninput="renderStores()"></div><div class="card"><div class="tableWrap"><table class="table"><thead><tr><th>Nº</th><th>Loja</th><th>CNPJ</th><th>IE</th><th>IM</th><th>Endereço</th><th>UF</th><th>Status</th><th>Analista</th><th>Ação</th></tr></thead><tbody id="storesTable"></tbody></table></div></div></section>
          <section class="page" id="page-prazos"><div class="head"><div><h1>Prazos fiscais</h1><p>Vencimentos por obrigação e UF.</p></div></div><div class="card"><div class="tableWrap"><table class="table"><thead><tr><th>Obrigação</th><th>UF</th><th>Vencimento</th><th>Observação</th></tr></thead><tbody id="deadlineTable"></tbody></table></div></div></section>
          <section class="page" id="page-historico"><div class="head"><div><h1>Histórico mensal</h1><p>Acompanhamento de recorrência e execução.</p></div></div><div class="card"><div class="tableWrap"><table class="table"><thead><tr><th>Competência</th><th>Conclusão</th><th>Alertas</th><th>Observação</th></tr></thead><tbody id="historyTable"></tbody></table></div></div></section>
          <section class="page" id="page-equipe"><div class="head"><div><h1>Equipe</h1><p>Colaboradores e situações.</p></div><button class="btn primary" onclick="openMember()">+ Novo colaborador</button></div><div class="card"><div class="tableWrap"><table class="table"><thead><tr><th>Colaborador</th><th>Função</th><th>Nível</th><th>Carteira</th><th>Situação</th><th>Ação</th></tr></thead><tbody id="teamTable"></tbody></table></div></div></section>
          <section class="page" id="page-gestao"><div class="head"><div><h1>Acompanhamento da gestão</h1><p>Visão consolidada dos analistas ativos, lojas, execuções e alertas.</p></div></div><div class="mgmtGrid" id="mgmtKpis"></div><div class="card pad"><div class="cardTitle"><div><h3>Acompanhamento individual</h3><small>Selecione um analista ativo para acompanhar sua carteira e execução.</small></div><span class="badge blue">Acompanhamento geral</span></div><div class="analystGrid" id="analystGrid"></div></div><div id="individual"></div></section>
          </div></main></div><div class="modalBack" id="modalBack"><div class="modal"><div class="modalHead"><b id="modalTitle">Cadastro</b><button class="btn" onclick="closeModal()">×</button></div><div class="modalBody" id="modalBody"></div><div class="modalFoot"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="modalSave">Salvar</button></div></div></div>
          <script src="app-clean.js?v=1"></script><script src="auth-clean.js?v=1"></script></body></html>
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "refactor: activate clean Fiscal Control runtime" && git push)
