name: Acompanhamento individual — somente ativos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  conectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conectar filtro ao HTML
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- ACOMPANHAMENTO-ATIVOS-V1 -->'
          tag='<script src="acompanhamento-individual-ativos.js?v=1"></script><script src="apuracao-query-button.js?v=1"></script>'+marker
          if 'apuracao-query-button.js' not in s:
              pos=s.rfind('</body>')
              if pos<0:
                  raise SystemExit('Tag </body> nao encontrada')
              s=s[:pos]+tag+s[pos:]
          elif marker not in s:
              s=s.replace('<!-- ACOMPANHAMENTO-ATIVOS-V1 -->',marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Publicar conexão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Adiciona botão Gerando Query em ICMS e PIS/COFINS"
          git push
